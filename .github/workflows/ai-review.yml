name: AI code review

on:
  workflow_run:
    workflows: [Review request]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Store API keys here; restrict this environment to the default branch (main).
    environment: ai-review
    steps:
      - name: Checkout trusted reviewer from workflow_run default-branch SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate event and fetch commit objects without checkout
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m developer_assistant.ci_review prepare --target "${{ runner.temp }}/review-objects.git"
      - name: Install dependencies from trusted lock file
        if: steps.prepare.outputs.ready == 'true'
        run: |
          python -m pip install --only-binary=:all: -r requirements-lock.txt
          python -m pip check
      - name: Review using the trusted package; PR contents are data
        if: steps.prepare.outputs.ready == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          HF_HOME: ${{ runner.temp }}/review-huggingface
        run: python -m developer_assistant.ci_review run
      - name: Save review and explicit skip/error reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-review-${{ github.event.workflow_run.id }}
          path: artifacts/review.*
          retention-days: 14
          if-no-files-found: error
